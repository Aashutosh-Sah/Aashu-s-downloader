<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aashu's Downloader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene">
    <div class="card">
      <div class="card__glow"></div>
      <header class="hero">
        <h1>Aashu's Downloader</h1>
        <p>Paste a YouTube link, then download audio as <strong>WAV</strong> or video as <strong>MP4</strong>.</p>
      </header>

      <div class="controls">
        <label for="urlInput">YouTube URL</label>
        <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false" />

        <div class="folder-row">
          <button id="chooseFolder">Choose output folder</button>
          <span id="folderPath">Default: Downloads</span>
        </div>

        <div class="button-row">
          <button id="downloadAudio" class="action audio">Download WAV</button>
          <button id="downloadVideo" class="action video">Download MP4</button>
        </div>

        <div class="status-panel">
          <div id="statusText">Ready.</div>
        </div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
